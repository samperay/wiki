# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
theme:
  name: material
  language: en
  font:
    text: Roboto Mono
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Navigation
    - navigation.instant          # Single-page app feel — no full page reloads
    - navigation.instant.progress # Show a progress bar on slow page loads
    - navigation.tracking         # URL updates as you scroll through a page
    - navigation.sections         # Top-level nav items rendered as sections
    - navigation.path             # Breadcrumb trail above the page title
    - navigation.top              # Back-to-top button when scrolling up
    - navigation.indexes          # Allow section index pages (e.g. section/index.md)
    # Table of contents
    - toc.follow                  # Sidebar TOC scrolls to follow reading position
    # Search
    - search.suggest              # Autocomplete suggestions while typing
    - search.highlight            # Highlight search terms on the result page
    - search.share                # Share button for search queries
    # Content
    - content.tabs.link           # Linked content tabs (same tab selected across pages)
    - content.code.copy           # Copy button on all code blocks
    - content.code.annotate       # Inline code annotations
    - content.tooltips            # Improved tooltips on abbreviations and links
    # Header
    - header.autohide             # Hide header when scrolling down, show on scroll up

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

# -----------------------------------------------------------------------------
# Markdown extensions
# -----------------------------------------------------------------------------
markdown_extensions:
  # Built-in
  - admonition          # !!! note / warning / tip blocks
  - footnotes           # [^1] footnote syntax
  - attr_list           # Add HTML attributes to elements { .class #id }
  - md_in_html          # Write Markdown inside raw HTML blocks
  - tables              # GitHub-flavoured tables
  - toc:
      permalink: true         # Anchor link on every heading
      permalink_title: Link to this section
      toc_depth: 3            # Show h2 and h3 in the right-hand TOC
  # PyMdown extensions
  - pymdownx.details          # Collapsible ??? blocks (extends admonition)
  - pymdownx.mark             # ==highlight== syntax
  - pymdownx.snippets         # --8<-- file inclusion
  - pymdownx.inlinehilite     # `#!python inline code` syntax highlighting
  - pymdownx.keys             # ++ctrl+c++ keyboard key rendering
  - pymdownx.tasklist:        # - [x] checkbox lists
      custom_checkbox: true
  - pymdownx.tabbed:          # === "Tab" content tabs
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

