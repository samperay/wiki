name: ci

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: wiki-gh-pages-deployment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          key: mkdocs-${{ hashFiles('requirements.txt') }}
          path: ~/.cache/pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy to GitHub Pages
        run: |
          # Retry if gh-pages changes between fetch and push (e.g. another publisher).
          for attempt in 1 2 3; do
            if mkdocs gh-deploy --force; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::GitHub Pages deployment failed after 3 attempts"
              exit 1
            fi
            echo "::warning::Deployment attempt $attempt failed; retrying in $((attempt * 10)) seconds"
            sleep $((attempt * 10))
          done
